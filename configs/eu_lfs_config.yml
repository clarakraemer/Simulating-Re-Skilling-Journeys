# -------------------------------------------------------------------------------------
# EU-LFS
#   n_digits_isco08: int
#     Number of digits in ISCO-08 occupation classification. Needs to be in [2, 4].
# -------------------------------------------------------------------------------------

# Paths to data folders
paths:
  raw: "data/eurostat_data/raw"
  raw_yf: "data/eurostat_data/raw/Yearly_Data/YearlyFiles_2023"
  interim: "data/eurostat_data/interim"
  processed: "data/eurostat_data/processed"
  fmt_folder: ""  # Correct if files are directly inside YearlyFiles_2023
  fmt_file: "{country}{year}_y.csv"

# Preprocessing parameters
preprocessing:
  n_digits_isco08: 3
  n_digits_nace: 1
  n_digits_nuts: 2
  years: ["2023"]
  countries: [ #GR not available
    "AT", "BE", "BG", "CH", "CY", "CZ", "DE", "DK", "EE", "EL", "ES", "FI", "FR", "HR",
    "HU", "IE", "IS", "IT", "LT", "LU", "LV", "MT", "NL", "NO", "PL", "PT", "RO", "SE",
    "SI", "SK"
  ]
  countries_isco08_2d: ["BG", "PL"]
  countries_isco08_1d: ["MT"]
  countries_nuts_1d: ["UK"]
  countries_nuts_0d: ["MT", "NL"]
  scaling_factor_coeff: 1000
  pension_age: [ '77', '82', '87', '92', '97' ]
  variables: [
    "WKSTAT", "SEX", "NACE2_1D", "ISCO08_3D", "COUNTRYW", "REGION_2DW", "FTPT", "REFYEAR",
    "COUNTRY", "REGION_2D", "DEGURBA", "HHTYPE", "AGE", "ILOSTAT", "EDUC4WEEKS", "HATLEV1D",
    "MAINSTAT", "INCDECIL", "COEFFY"
  ] # uses names from 2021 onwards. Old: WSTATOR, NACE1D, ISCO03, REGIONW, REGION, EDUC4WN, COEFF

  na_values:
    WKSTAT: [ "0", "9", "" ]
    SEX: [ "0", "9", "" ]
    NACE2_1D: [ "0", "9", "" ]
    ISCO08_3D: [ "0", "9", "99", "999", "" ]
    COUNTRYW: [ "0", "9", "99", "" ]
    REGION_2DW: [ "9", "99", "" ]
    FTPT: [ "0", "9", "" ]
    REFYEAR: [ "0", "9999", "" ]
    COUNTRY: [ "0", "9", "99", "" ]
    REGION_2D: [ "9", "99", "" ]
    ILOSTAT: [ "0", "9", "" ]
    EDUC4WEEKS: [ "0", "9", "" ]
    HATLEV1D: [ "0", "9", "" ]
    MAINSTAT: [ "0", "9", "" ]
    INCDECIL: [ "0", "9", "99", "" ]
    AGE: [ "0", "99", "" ]

  dtypes_in: {
    "WKSTAT": "str",
    "SEX": "str",
    "NACE2_1D": "str",
    "ISCO08_3D": "str",
    "COUNTRYW": "str",
    "REGION_2DW": "str",
    "FTPT": "str",
    "REFYEAR": "str",
    "COUNTRY": "str",
    "REGION_2D": "str",
    "DEGURBA": "str",
    "HHTYPE": "str",
    "AGE": "str",
    "ILOSTAT": "str",
    "EDUC4WEEKS": "str",
    "HATLEV1D": "str",
    "MAINSTAT": "str",
    "INCDECIL": "str",
    "COEFFY": "float"
}
  dtypes_out: {
    "WKSTAT": "category",
    "SEX": "category",
    "NACE2_1D": "category",
    "ISCO08_3D": "category",
    "COUNTRYW": "category",
    "REGION_2DW": "category",
    "FTPT": "category",
    "REFYEAR": "Int64", # prev. category
    "COUNTRY": "category",
    "REGION_2D": "category",
    "DEGURBA": "category",
    "HHTYPE": "category",
    "AGE": "Int64", # prev. category
    "ILOSTAT": "category",
    "EDUC4WEEKS": "category",
    "HATLEV1D": "category",
    "MAINSTAT": "category",
    "INCDECIL": "category",
    "COEFFY": "float"
}

# map parameters (projection, ...)
visualisation:
  epsg: 3035
  bbox_eu_epsg_3035: [2500000.0, 6000000.0, 1300000.0, 5500000.0]
  missing_kwds: {"facecolor": "white", "hatch": "//", "edgecolor": "grey"}
  edgecolor: "grey"
  linewidth: 0.5
  robust_cmap_percentiles: [2, 98]
  cmap: "Greys"
  countries_for_maps: [
    "AT", "BE", "CH", "CY", "CZ", "DE", "DK", "EE", "EL", "ES", "FI", "FR", "HR",
    "HU", "IE", "IS", "IT", "LT", "LU", "LV", "NL", "NO", "PT", "RO", "SE",
    "SI", "SK"
  ]