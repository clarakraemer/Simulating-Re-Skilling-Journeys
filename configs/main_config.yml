# metadata giving hints on how the config file should be parsed
metadata:
  path_keys: ["eulfs", "crosswalk"]

# -------------------------------------------------------------------------------------
# PATHS
# -------------------------------------------------------------------------------------
# EU-LFS Data
eulfs:
  raw: "data/eurostat_data/raw"
  raw_yf: "data/eurostat_data/raw/Yearly_Data/YearlyFiles_2023"
  interim: "data/eurostat_data/interim"
  processed: "data/eurostat_data/processed"

crosswalk:
  onet_esco: "data/raw/mapping-career-causeways/codebase/data/processed/ESCO_ONET_xwalk_full.csv"

# Note: relative paths need to start one level below the project directory
#   to be parsed correctly

# -------------------------------------------------------------------------------------
# ESCO
# -------------------------------------------------------------------------------------
ESCO:
  LANGUAGE: "en"
  VERSION: "v1.0.3"
  VERSION_NEWEST: "v1.1.0"
  WEIGHT_UNIFORM: 1
  WEIGHT_ESSENTIAL_SKILL: 1
  WEIGHT_OPTIONAL_SKILL: 0.5

# -------------------------------------------------------------------------------------
# Transition Analysis Parameters
# -------------------------------------------------------------------------------------
TRANSITION_ANALYSIS:
  MIN_VIABLE: 0.3
  HIGHLY_VIABLE: 0.4
  MAX_JOB_ZONE_DIF: 1
  MIN_EARNINGS_RATIO: 0.75